version: '3.8'

services:
  # 1. FastAPI REST API Web Service
  web:
    build: .
    container_name: print_ai_app
    ports:
      - "8000:8000"
    volumes:
      - ./fixed_files:/app/fixed_files
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@db:5432/print_ai_db
      - JWT_SECRET_KEY=your_super_secret_jwt_key
    depends_on:
      - db
    restart: always

  # 2. Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: print_ai_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=print_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: